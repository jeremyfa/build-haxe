name: Build Haxe

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Haxe repository URL
        default: https://github.com/HaxeFoundation/haxe.git
      ref:
        description: Branch or commit
        default: development
      profile:
        description: Dependency profile (auto, haxe5, haxe43)
        default: auto
      run_tests:
        description: Run the default test suites of the profile
        type: boolean
        default: true
      publish:
        description: Publish a GitHub release
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-haxe.yml'
      - '*.sh'
      - 'scripts/**'
      - 'docker/**'
      - 'profiles/**'
      - 'patches/**'
      - 'versions.env'
      - 'Brewfile'
      - '.github/actions/**'

permissions:
  contents: write

concurrency:
  group: build-haxe-${{ github.event_name }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  # Every pinned dependency must be in the dependency mirror (jeremyfa/haxe-deps,
  # see scripts/mirror-deps.sh and .github/workflows/mirror-deps.yml). Builds
  # still fall back to the original hosts, so this check does not block them
  # (continue-on-error): it shows what is missing in the run summary.
  mirror-check:
    name: Check the dependency mirror
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=0
          scripts/mirror-deps.sh --check all 2>&1 | tee mirror-check.txt || status=$?
          { echo "### Dependency mirror"; echo '```'; tail -n 40 mirror-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  resolve:
    name: Resolve commits
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve commits, profiles and existing releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          source versions.env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            repo="$INPUT_REPO"; refs="$INPUT_REF"; forced="$INPUT_PROFILE"
          else
            repo="$DEFAULT_HAXE_REPO"; refs="development 4.3_bugfix"; forced=auto
          fi
          builds="[]"
          for ref in $refs; do
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              commit="$ref"
            else
              commit="$(git ls-remote "$repo" "refs/heads/$ref" | cut -f1)"
              [ -n "$commit" ] || { echo "branch $ref not found in $repo"; exit 1; }
            fi
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" fetch -q --depth 1 "$repo" "$commit"
            opam_file="$(git -C "$tmp" show FETCH_HEAD:haxe.opam)"
            if [ "$forced" != "auto" ]; then profile="$forced"
            elif echo "$opam_file" | grep -q '"camlp5"'; then profile=haxe43
            else profile=haxe5; fi
            ocaml="$(sed -n 's/^: "${OCAML_VERSION:=\(.*\)}"/\1/p' "profiles/$profile/profile.env")"
            short="${commit:0:10}"
            tag="haxe-$profile-$short"
            if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "release $tag already exists, skipping"
              continue
            fi
            builds="$(echo "$builds" | jq -c --arg repo "$repo" --arg ref "$ref" --arg commit "$commit" \
              --arg short "$short" --arg profile "$profile" --arg ocaml "$ocaml" \
              '. + [{repo: $repo, ref: $ref, commit: $commit, short: $short, profile: $profile, ocaml: $ocaml}]')"
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$builds" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "$builds" | jq .

  build:
    name: ${{ matrix.platform.name }} (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
        platform:
          - { name: mac-universal, runner: macos-15 }
          - { name: linux-x64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: windows-x64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4

      # The same action a calling project uses (see README.md).
      - name: Build
        id: haxe
        uses: ./.github/actions/build-haxe
        with:
          platform: ${{ matrix.platform.name }}
          repo: ${{ matrix.build.repo }}
          ref: ${{ matrix.build.commit }}
          profile: ${{ matrix.build.profile }}
          run-tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-${{ matrix.platform.name }}
          path: ${{ steps.haxe.outputs.archive }}
          retention-days: 7

  publish-release:
    name: Publish release (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: [resolve, build]
    if: needs.resolve.outputs.any == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          b='${{ toJSON(matrix.build) }}'
          profile="$(echo "$b" | jq -r .profile)"
          short="$(echo "$b" | jq -r .short)"
          commit="$(echo "$b" | jq -r .commit)"
          repo="$(echo "$b" | jq -r .repo)"
          ref="$(echo "$b" | jq -r .ref)"
          echo "$commit" > release-assets/commit.txt
          ls -l release-assets
          web="${repo%.git}"
          gh release create "haxe-$profile-$short" -R "${{ github.repository }}" \
            --title "Haxe $profile $(date -u +%Y-%m-%d) ($short)" \
            --notes "Automated build of Haxe ($ref) from commit [$commit]($web/commit/$commit).

          Profile: $profile

          - macOS universal (arm64 + x86_64): haxe-$profile-$short-mac-universal.zip
          - Linux x64 and arm64 (static haxe binary): haxe-$profile-$short-linux-{x64,arm64}.tar.gz
          - Windows x64: haxe-$profile-$short-windows-x64.zip

          Each archive contains haxe, haxelib, std and the neko runtime used by haxelib." \
            release-assets/*
