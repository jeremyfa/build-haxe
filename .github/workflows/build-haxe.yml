name: Build Haxe

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Haxe repository URL
        default: https://github.com/HaxeFoundation/haxe.git
      ref:
        description: Branch or commit
        default: development
      profile:
        description: Dependency profile (auto, haxe5, haxe43)
        default: auto
      run_tests:
        description: Run the default test suites of the profile
        type: boolean
        default: true
      publish:
        description: Publish a GitHub release
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-haxe.yml'
      - '*.sh'
      - 'scripts/**'
      - 'docker/**'
      - 'profiles/**'
      - 'versions.env'

permissions:
  contents: write

concurrency:
  group: build-haxe-${{ github.event_name }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve commits
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve commits, profiles and existing releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          source versions.env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            repo="$INPUT_REPO"; refs="$INPUT_REF"; forced="$INPUT_PROFILE"
          else
            repo="$DEFAULT_HAXE_REPO"; refs="development 4.3_bugfix"; forced=auto
          fi
          builds="[]"
          for ref in $refs; do
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              commit="$ref"
            else
              commit="$(git ls-remote "$repo" "refs/heads/$ref" | cut -f1)"
              [ -n "$commit" ] || { echo "branch $ref not found in $repo"; exit 1; }
            fi
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" fetch -q --depth 1 "$repo" "$commit"
            opam_file="$(git -C "$tmp" show FETCH_HEAD:haxe.opam)"
            if [ "$forced" != "auto" ]; then profile="$forced"
            elif echo "$opam_file" | grep -q '"camlp5"'; then profile=haxe43
            else profile=haxe5; fi
            ocaml="$(sed -n 's/^: "${OCAML_VERSION:=\(.*\)}"/\1/p' "profiles/$profile/profile.env")"
            short="${commit:0:10}"
            tag="haxe-$profile-$short"
            if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "release $tag already exists, skipping"
              continue
            fi
            builds="$(echo "$builds" | jq -c --arg repo "$repo" --arg ref "$ref" --arg commit "$commit" \
              --arg short "$short" --arg profile "$profile" --arg ocaml "$ocaml" \
              '. + [{repo: $repo, ref: $ref, commit: $commit, short: $short, profile: $profile, ocaml: $ocaml}]')"
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$builds" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "$builds" | jq .

  mac:
    name: macOS ${{ matrix.arch }} (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
        arch: [arm64, x86_64]
    env:
      HAXE_REPO: ${{ matrix.build.repo }}
      HAXE_COMMIT: ${{ matrix.build.commit }}
      HAXE_PROFILE: ${{ matrix.build.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: brew bundle --file=Brewfile

      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Cache opam root
        uses: actions/cache@v4
        with:
          path: .cache/opam
          key: opam-${{ matrix.build.profile }}-mac-${{ matrix.arch }}-${{ hashFiles(format('profiles/{0}/**', matrix.build.profile), 'versions.env') }}

      - name: Build
        run: ./build-haxe-mac.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.build.profile }}-${{ matrix.build.short }}-mac-${{ matrix.arch }}
          path: build/${{ matrix.build.profile }}/mac-${{ matrix.arch }}/stage
          retention-days: 7

  mac-universal:
    name: macOS universal (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: [resolve, mac]
    if: needs.resolve.outputs.any == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    env:
      HAXE_REPO: ${{ matrix.build.repo }}
      HAXE_COMMIT: ${{ matrix.build.commit }}
      HAXE_PROFILE: ${{ matrix.build.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: brew bundle --file=Brewfile

      - uses: actions/download-artifact@v4
        with:
          name: stage-${{ matrix.build.profile }}-${{ matrix.build.short }}-mac-arm64
          path: build/${{ matrix.build.profile }}/mac-arm64/stage

      - uses: actions/download-artifact@v4
        with:
          name: stage-${{ matrix.build.profile }}-${{ matrix.build.short }}-mac-x86_64
          path: build/${{ matrix.build.profile }}/mac-x86_64/stage

      - name: Combine, verify and package
        run: |
          chmod +x build/*/mac-*/stage/haxe
          ./build-haxe-mac.sh universal --from-stages

      - name: Test
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: ./test-haxe.sh mac-universal

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-mac-universal
          path: build/archives/*.zip
          retention-days: 7

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
        arch: [x64, arm64]
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      HAXE_REPO: ${{ matrix.build.repo }}
      HAXE_COMMIT: ${{ matrix.build.commit }}
      HAXE_PROFILE: ${{ matrix.build.profile }}
      BUILD_HAXE_OPAM_CACHE: ${{ github.workspace }}/.cache/opam-linux
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam root
        uses: actions/cache@v4
        with:
          path: .cache/opam-linux
          key: opam-${{ matrix.build.profile }}-linux-${{ matrix.arch }}-${{ hashFiles(format('profiles/{0}/**', matrix.build.profile), 'versions.env', 'docker/linux.Dockerfile') }}

      - name: Build
        run: ./build-haxe-linux.sh ${{ matrix.arch }}

      - name: Test
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: SKIP_SETUP=1 ./test-haxe.sh linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-linux-${{ matrix.arch }}
          path: build/archives/*.tar.gz
          retention-days: 7

  windows:
    name: Windows x64 (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    env:
      HAXE_REPO: ${{ matrix.build.repo }}
      HAXE_COMMIT: ${{ matrix.build.commit }}
      HAXE_PROFILE: ${{ matrix.build.profile }}
      OPAMEXTERNALSOLVER: builtin-mccs+glpk
      CYGWIN_BASH: D:\cygwin\bin\bash.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Read pinned opam-repository commit
        id: pins
        shell: bash
        run: echo "opam_repo=$(sed -n 's/^OPAM_REPO_COMMIT=//p' versions.env)" >> "$GITHUB_OUTPUT"

      # ocaml/setup-ocaml v3, pinned by commit
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: ${{ matrix.build.ocaml }}
          windows-compiler: mingw
          opam-repositories: |
            pinned: git+https://github.com/ocaml/opam-repository#${{ steps.pins.outputs.opam_repo }}

      - name: Clone Haxe, C libraries and OCaml dependencies (with retries)
        run: |
          opam exec -- $env:CYGWIN_BASH -c "./setup-haxe.sh"
          opam exec -- $env:CYGWIN_BASH -c "scripts/fetch-neko.sh windows-x64 && scripts/build-deps.sh windows-x64"
          for ($i = 1; $i -le 3; $i++) {
            opam exec -- $env:CYGWIN_BASH -c "scripts/setup-switch.sh windows-x64"
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Write-Host "opam install failed, retrying ($i/3)"
          }

      - name: Build
        run: opam exec -- $env:CYGWIN_BASH -c "SKIP_SETUP=1 ./build-haxe-windows.sh"

      - name: Test
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: opam exec -- $env:CYGWIN_BASH -c "./test-haxe.sh windows-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-windows-x64
          path: build/archives/*.zip
          retention-days: 7

  publish-release:
    name: Publish release (${{ matrix.build.profile }} ${{ matrix.build.short }})
    needs: [resolve, mac-universal, linux, windows]
    if: needs.resolve.outputs.any == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-${{ matrix.build.profile }}-${{ matrix.build.short }}-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          b='${{ toJSON(matrix.build) }}'
          profile="$(echo "$b" | jq -r .profile)"
          short="$(echo "$b" | jq -r .short)"
          commit="$(echo "$b" | jq -r .commit)"
          repo="$(echo "$b" | jq -r .repo)"
          ref="$(echo "$b" | jq -r .ref)"
          echo "$commit" > release-assets/commit.txt
          ls -l release-assets
          web="${repo%.git}"
          gh release create "haxe-$profile-$short" -R "${{ github.repository }}" \
            --title "Haxe $profile $(date -u +%Y-%m-%d) ($short)" \
            --notes "Automated build of Haxe ($ref) from commit [$commit]($web/commit/$commit).

          Profile: $profile

          - macOS universal (arm64 + x86_64): haxe-$profile-$short-mac-universal.zip
          - Linux x64 and arm64 (static haxe binary): haxe-$profile-$short-linux-{x64,arm64}.tar.gz
          - Windows x64: haxe-$profile-$short-windows-x64.zip

          Each archive contains haxe, haxelib, std and the neko runtime used by haxelib." \
            release-assets/*
